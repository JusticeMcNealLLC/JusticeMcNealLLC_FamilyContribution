<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Events | Justice McNeal LLC</title>
    <link rel="stylesheet" href="../../theme/Theme_JMLLC001/Theme_JMLLC001.css?v=190">
    <link rel="stylesheet" href="../../css/tailwind.Theme_JMLLC001.css?v=190">
    <link rel="stylesheet" href="../../css/shared.css?v=181">
    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#13366E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JMLLC">
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="../../css/pages/portal/events/index.css?v=231">
</head>
<body class="min-h-screen bg-surface font-sans antialiased flex flex-col has-bottom-bar" data-page-type="portal" data-active-page="events">

    <div id="nav-placeholder"></div>

    <main class="flex-1 w-full">

        <!-- ═══ List View (events_003 — A2 DOM rewrite) ═══ -->
        <div id="eventsListView">

            <!-- Page title/greeting header removed — create lives on #evtCreateFab -->
            <header id="evtPageHeader" class="hidden" aria-hidden="true" hidden>
                <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-end justify-between gap-3">
                    <div class="min-w-0">
                        <p id="evtGreetingHello" class="hidden evt-greeting-hello text-sm font-semibold text-primary mb-1">Hey, <span data-greeting-name>there</span> <span aria-hidden="true">👋</span></p>
                        <h1 id="evtHeaderTitle" class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight leading-none">Events</h1>
                        <p id="evtHeaderCount" class="text-xs text-gray-500 mt-1.5 truncate">Loading…</p>
                        <p id="evtGreetingSub" class="hidden evt-greeting-sub text-sm text-gray-500 mt-1">Discover and join events in your community.</p>
                    </div>
                    <button id="createEventBtn" type="button" class="hidden" aria-hidden="true" tabindex="-1"></button>
                </div>
            </header>

            <div id="evtHeaderSentinel" class="hidden h-px -mt-px" aria-hidden="true"></div>

            <div id="evtShell" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pb-24 sm:pb-10 pt-3">
              <div class="evt-shell-main">

                <!-- Live banner (hidden by default — populated in Phase B) -->
                <div id="evtLiveBanner" class="hidden mt-3"></div>

                <!-- F19 — Hero card moved BELOW the filter+chip strip so the banner sits under the event-type chips. Empty placeholder kept here for legacy queries; live mount is #evtHero further down. -->

                <!-- E5 — Top Picks rail (vlift only; conditional on >=2 pinned-LLC-future) -->
                <section id="evtTopPicks" class="hidden mt-6" data-evt-section="top-picks">
                    <header class="flex items-center justify-between mb-3">
                        <h2 class="text-xs font-bold uppercase tracking-[0.14em] text-gray-500">🔥 Top Picks</h2>
                        <button type="button" id="evtTopPicksSeeAll" class="evt-bucket-seeall text-xs font-semibold text-primary hover:text-primary-700">See all →</button>
                    </header>
                    <div id="evtTopPicksScroll" class="flex gap-3 overflow-x-auto snap-x snap-mandatory pb-2 -mx-4 px-4 sm:mx-0 sm:px-0 evt-scroll-hide"></div>
                </section>

                <!-- Sticky filter strip: search+Filters, then lifecycle tabs -->
                <div id="evtFilterStrip"
                     class="bg-surface/85 backdrop-blur -mx-4 px-4 sm:-mx-6 sm:px-6 lg:-mx-8 lg:px-8 py-3">
                    <!-- Row 1: Search + Filters (+ Date / view on desktop) -->
                    <div id="evtFilterRow2" class="flex items-center gap-2">
                        <div id="evtSearchExpand" class="relative flex-1 min-w-0">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
                            <input id="evtSearchInput" type="search" autocomplete="off" placeholder="Search events, hosts, or locations…"
                                class="w-full pl-9 pr-9 py-2.5 rounded-xl border border-gray-200 bg-white sm:text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
                            <button id="evtSearchClear" type="button" aria-label="Clear search"
                                class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-100">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <button id="evtSearchToggle" type="button" aria-label="Search events" aria-expanded="true"
                            class="hidden w-10 h-10 items-center justify-center rounded-xl border border-gray-200 bg-white hover:border-gray-300 text-gray-600 shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
                        </button>
                        <div id="evtTypeMenuBtnWrap" class="relative shrink-0">
                            <button id="evtTypeMenuBtn" type="button" data-type="all" aria-label="Filters" aria-haspopup="true" aria-expanded="false"
                                class="evt-filter-btn h-10 inline-flex items-center gap-1.5 px-3 rounded-xl border border-gray-200 bg-white hover:border-gray-300 text-sm font-semibold text-gray-700">
                                <svg data-f4-filters-icon class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 4h18M6 8h12M10 12h4M11 16h2"/></svg>
                                <span data-type-label>Filters</span>
                                <span class="evt-filter-dot hidden" aria-hidden="true"></span>
                                <svg class="evt-filter-chevron w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <div id="evtTypeMenu" class="hidden absolute right-0 top-full mt-1.5 w-48 rounded-xl border border-gray-200 bg-white shadow-lg overflow-hidden z-50">
                                <button type="button" data-type="all" class="evt-type-opt evt-type-opt--active">All events</button>
                                <button type="button" data-type="llc" class="evt-type-opt">LLC events</button>
                                <button type="button" data-type="member" class="evt-type-opt">Member events</button>
                                <button type="button" data-type="competition" class="evt-type-opt">Competitions</button>
                            </div>
                        </div>
                        <!-- F4 — Date filter dropdown (vlift only; hidden when flag off) -->
                        <div class="relative shrink-0 hidden" data-f4-date-wrap>
                            <button id="evtDateMenuBtn" type="button" data-date="any" aria-haspopup="true" aria-expanded="false"
                                class="h-10 inline-flex items-center gap-1.5 px-3 rounded-xl border border-gray-200 bg-white hover:border-gray-300 text-sm font-semibold text-gray-700">
                                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <span data-date-label>Date</span>
                                <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <div id="evtDateMenu" class="hidden absolute right-0 top-full mt-1.5 w-44 rounded-xl border border-gray-200 bg-white shadow-lg overflow-hidden z-50">
                                <button type="button" data-date="any"      class="evt-date-opt evt-date-opt--active">Any date</button>
                                <button type="button" data-date="today"    class="evt-date-opt">Today</button>
                                <button type="button" data-date="week"     class="evt-date-opt">This week</button>
                                <button type="button" data-date="weekend"  class="evt-date-opt">This weekend</button>
                                <button type="button" data-date="month"    class="evt-date-opt">This month</button>
                            </div>
                        </div>
                        <button id="evtViewToggle" type="button" aria-label="Toggle calendar view" aria-pressed="false" data-view="list"
                            class="hidden sm:inline-flex w-10 h-10 items-center justify-center rounded-xl border border-gray-200 bg-white hover:border-gray-300 text-gray-600 shrink-0">
                            <span class="evt-view-icon evt-view-icon--list" aria-hidden="true">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2" stroke-linejoin="round"/><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M8 4v16"/></svg>
                            </span>
                            <span class="evt-view-icon evt-view-icon--calendar hidden" aria-hidden="true">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                            </span>
                        </button>
                    </div>

                    <!-- Row 2: Lifecycle tabs -->
                    <div role="tablist" id="evtLifecycleSeg" class="evt-seg w-full mt-2">
                        <button role="tab" type="button" data-filter="upcoming" class="evt-seg__btn evt-seg__btn--active" aria-selected="true">Upcoming</button>
                        <button role="tab" type="button" data-filter="past" class="evt-seg__btn" aria-selected="false">Past</button>
                        <button role="tab" type="button" data-filter="going" class="evt-seg__btn" aria-selected="false">Going</button>
                        <button role="tab" type="button" data-filter="saved" class="evt-seg__btn" aria-selected="false">Saved</button>
                    </div>

                    <!-- Retired type chip rail (kept hidden for any legacy selectors) -->
                    <div id="evtTypeChips" class="hidden" hidden aria-hidden="true"></div>
                </div>

                <!-- Hidden compat select (legacy `typeFilter` change listener in init.js) -->
                <select id="typeFilter" class="hidden" aria-hidden="true" tabindex="-1">
                    <option value="all" selected>All Types</option>
                    <option value="llc">LLC Events</option>
                    <option value="member">Member Events</option>
                    <option value="competition">Competitions</option>
                </select>

                <!-- Featured hero under filter strip -->
                <section id="evtHero"></section>

                <!-- "You're going" rail (hidden by default — populated in Phase B) -->
                <section id="evtGoingRail" class="hidden mt-6">
                    <header class="flex items-center justify-between mb-3">
                        <h2 class="text-xs font-bold uppercase tracking-[0.14em] text-gray-500">You're going</h2>
                        <a href="#" data-action="see-all-going" class="text-xs font-semibold text-primary hover:text-primary-700">See all →</a>
                    </header>
                    <div id="evtGoingRailScroll" class="flex gap-3 overflow-x-auto snap-x snap-mandatory pb-2 -mx-4 px-4 sm:mx-0 sm:px-0 evt-scroll-hide"></div>
                </section>

                <!-- Bucketed groups -->
                <div id="evtGroups" class="mt-6 space-y-8"></div>

                <!-- D1 — Calendar mount (events_004 §D1) -->
                <div id="evtCalendarMount" class="hidden mt-6"></div>

                <!-- D1 — Day-details modal (single instance, populated on demand) -->
                <div id="evtDayModal" class="hidden fixed inset-0 z-[70]" role="dialog" aria-modal="true" aria-labelledby="evtDayModalTitle">
                    <div class="absolute inset-0 bg-black/40" data-day-close="1"></div>
                    <div class="absolute inset-x-0 bottom-0 sm:inset-0 sm:m-auto sm:max-w-lg sm:h-fit sm:rounded-2xl bg-white rounded-t-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
                            <h3 id="evtDayModalTitle" class="text-base font-semibold text-gray-900"></h3>
                            <button type="button" data-day-close="1" class="p-1.5 rounded-md text-gray-400 hover:text-gray-700 hover:bg-gray-100" aria-label="Close">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <div id="evtDayModalBody" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
                    </div>
                </div>

                <!-- Hidden compat grid (kept for any legacy callers) -->
                <div id="eventsGrid" class="hidden"></div>

                <!-- Empty state -->
                <div id="emptyState" class="hidden mt-8">
                    <div class="bg-white rounded-2xl border border-gray-200/80 shadow-sm p-10 sm:p-14 text-center max-w-lg mx-auto evt-empty-card">
                        <div id="emptyIllo" class="w-24 h-24 mx-auto mb-4 evt-empty-illo">
                            <div class="w-16 h-16 bg-primary-50 rounded-2xl flex items-center justify-center mx-auto">
                                <svg class="w-8 h-8 text-primary-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5"></path>
                                </svg>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-gray-900 mb-1.5" id="emptyTitle">No upcoming events</h3>
                        <p class="text-sm text-gray-500 leading-relaxed max-w-xs mx-auto" id="emptySubtext">Check back soon — events will show up here!</p>
                        <button id="emptyCreateBtn" type="button"
                            class="hidden mt-5 inline-flex items-center gap-2 bg-primary hover:bg-primary-hover text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            Create Event
                        </button>
                        <button id="emptySecondaryBtn" type="button"
                            class="hidden mt-4 evt-empty-link text-sm font-semibold text-primary hover:text-primary-700 underline-offset-2 hover:underline">
                        </button>
                    </div>
                </div>

              </div><!-- /.evt-shell-main -->

              <!-- F2 — Right rail (vlift only; hidden <lg). Populated by F10/F11/F12. -->
              <aside id="evtRightRail" class="evt-shell-rail hidden" aria-label="Events sidebar">
                <div id="evtRailSlotCalendar"></div>
                <div id="evtRailSlotRsvps"></div>
                <div id="evtRailSlotStats"></div>
              </aside>

            </div><!-- /#evtShell -->

            <!-- Create Event FAB — circle + plus (permission-gated by JS) -->
            <button id="evtCreateFab" type="button" aria-label="Create event"
                class="evt-create-fab hidden fixed right-4 z-[45] w-14 h-14 rounded-full bg-primary text-white shadow-xl active:scale-95 transition-transform items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
            </button>
        </div><!-- /eventsListView -->

        <!-- ═══ Detail View (loaded dynamically by evtRouteByUrl) ═══ -->
        <div id="eventsDetailView" class="hidden"></div>

    </main>

    <!-- ─── QR Scanner Modal ────────────────────────────── -->
    <div id="scannerModal" class="fixed inset-0 z-[60] hidden">
        <div class="modal-overlay absolute inset-0 bg-black/50" id="scannerModalOverlay"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
                <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100/80">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-primary-100 flex items-center justify-center">
                            <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 013.75 9.375v-4.5z"></path></svg>
                        </div>
                        <h2 class="text-lg font-bold text-gray-900">Scan QR Code</h2>
                    </div>
                    <button id="closeScannerModal" class="w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100 transition">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div class="p-5">
                    <video id="scannerVideo" autoplay playsinline class="bg-black rounded-xl mb-4"></video>
                    <canvas id="scannerCanvas" class="hidden"></canvas>
                    <div id="scanResult" class="text-center text-sm font-medium"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <div id="tabs-placeholder"></div>

    <!-- ─── Raffle Draw Modal ────────────────────────────── -->
    <div id="raffleDrawModal" class="fixed inset-0 z-[75] hidden">
        <div class="modal-overlay absolute inset-0 bg-black/60 backdrop-blur-sm" id="raffleDrawOverlay"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
                <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100/80">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-amber-100 flex items-center justify-center">
                            <span class="text-base">🎰</span>
                        </div>
                        <h2 class="text-lg font-bold text-gray-900">Raffle Draw</h2>
                    </div>
                    <button id="closeRaffleDrawModal" class="w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100 transition">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div id="raffleDrawContent" class="p-6 text-center">
                    <!-- Populated dynamically by raffle.js -->
                </div>
            </div>
        </div>
    </div>

    <!-- ─── Fullscreen Map Overlay ─────────────────────── -->
    <div id="fullscreenMapOverlay" class="fixed inset-0 z-[80] hidden" style="background:#fff;">
        <div id="fullscreenMapContainer" class="absolute inset-0"></div>
        <!-- Controls layer — sits above Leaflet entirely -->
        <div class="absolute inset-0" style="z-index:9999; pointer-events:none;">
            <!-- Close + Re-center buttons stacked top-right -->
            <div class="absolute top-0 right-0 flex flex-col gap-2" style="pointer-events:auto; margin-top:max(1rem, env(safe-area-inset-top)); margin-right:1rem;">
                <button type="button" data-evt-action="evtCloseFullscreenMap" class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center shadow-lg" aria-label="Close map">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
                <button type="button" data-evt-action="evtRecenterFullscreenMap" class="w-10 h-10 bg-black/40 backdrop-blur-sm rounded-full flex items-center justify-center shadow-lg" aria-label="Re-center map">
                    <svg class="w-5 h-5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="22" y2="12"/></svg>
                </button>
            </div>
            <!-- Get Directions button at bottom -->
            <div class="absolute bottom-0 left-0 right-0 p-4" style="pointer-events:auto; padding-bottom:max(1rem, calc(72px + env(safe-area-inset-bottom, 0px)));">
                <a id="fullscreenMapDirections" href="#" target="_blank" rel="noopener"
                   class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-hover text-white px-5 py-3.5 rounded-2xl text-sm font-bold transition shadow-xl">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Get Directions
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/config.js"></script>
    <script type="module" src="../../js/components/pageShell/index.js"></script>
    <script src="../../js/components/notifications.js"></script>
    <script src="../../js/push.js"></script>
    <script src="../../js/auth/shared.js"></script>
    <!-- Events — main.js → esbuild → events.bundle.js (build: npm run build:events | watch: npm run dev:events) -->
    <script src="../../js/portal/events/events.bundle.js?v=240"></script>
    <script src="../../js/sw-register.js"></script>
</body>
</html>
